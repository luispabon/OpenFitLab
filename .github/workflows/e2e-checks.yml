name: E2E checks

permissions:
  contents: read

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      E2E_API_PORT: 3098
      E2E_DB_PORT: 3308
      E2E_FRONT_PORT: 4201
      E2E_PROJECT: openfitlab-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate ephemeral SESSION_SECRET
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start E2E stack
        run: |
          DB_HOST_PORT=${{ env.E2E_DB_PORT }} \
          API_HOST_PORT=${{ env.E2E_API_PORT }} \
          FRONT_HOST_PORT=${{ env.E2E_FRONT_PORT }} \
          docker compose -p ${{ env.E2E_PROJECT }} -f compose.yaml -f compose.e2e.yaml \
            up -d db valkey api frontend

      - name: Wait for API health
        run: |
          timeout 180 bash -c \
            'until curl -sf http://localhost:${{ env.E2E_API_PORT }}/health > /dev/null; do sleep 3; done'

      - name: Wait for frontend
        run: |
          timeout 300 bash -c \
            'until curl -sf http://localhost:${{ env.E2E_FRONT_PORT }} > /dev/null; do sleep 3; done'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          E2E_API_PORT: ${{ env.E2E_API_PORT }}
          E2E_FRONT_PORT: ${{ env.E2E_FRONT_PORT }}
          E2E_BASE_URL: http://localhost:${{ env.E2E_FRONT_PORT }}
          E2E_COMPOSE_PROJECT: ${{ env.E2E_PROJECT }}
        run: npx playwright test

      - name: Diagnose E2E stack on failure
        if: failure()
        run: |
          DB_HOST_PORT=${{ env.E2E_DB_PORT }} \
          API_HOST_PORT=${{ env.E2E_API_PORT }} \
          FRONT_HOST_PORT=${{ env.E2E_FRONT_PORT }} \
          docker compose -p ${{ env.E2E_PROJECT }} -f compose.yaml -f compose.e2e.yaml \
            ps -a
          DB_HOST_PORT=${{ env.E2E_DB_PORT }} \
          API_HOST_PORT=${{ env.E2E_API_PORT }} \
          FRONT_HOST_PORT=${{ env.E2E_FRONT_PORT }} \
          docker compose -p ${{ env.E2E_PROJECT }} -f compose.yaml -f compose.e2e.yaml \
            logs --no-color --timestamps --tail 200 frontend

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Tear down E2E stack
        if: always()
        run: |
          DB_HOST_PORT=${{ env.E2E_DB_PORT }} \
          API_HOST_PORT=${{ env.E2E_API_PORT }} \
          FRONT_HOST_PORT=${{ env.E2E_FRONT_PORT }} \
          docker compose -p ${{ env.E2E_PROJECT }} -f compose.yaml -f compose.e2e.yaml \
            down -v
